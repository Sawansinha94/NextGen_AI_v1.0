# Copy this file to db_config.cfg and fill in your private PostgreSQL values.

[postgresql]
host = your-postgres-host
port = 5432
database = your-database
user = your-user
password = your-password
sslmode = require

[faq]
table = servicenow_incident_faq
id_column = user_query
question_column = user_query
answer_column = output_column
intent_column = api_method
api_query_column = filter

[logging]
table = faq_agent_logging